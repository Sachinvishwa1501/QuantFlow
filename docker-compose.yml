services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quantflow
      POSTGRES_USER: quantflow
      POSTGRES_PASSWORD: quantflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantflow -d quantflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres-data:
